services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    env_file:
      - path: ../.env.example
        required: true
      - path: ../.env
        required: false
    ports:
      - "8010:8000"
    volumes:
      - ../:/app
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hamilton
      POSTGRES_USER: hamilton
      POSTGRES_PASSWORD: hamilton
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5442:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hamilton -d hamilton"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
